services:
  - type: web
    name: trust7-gatekeeper-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # Set in the Render dashboard (Environment tab). Never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The Vercel frontend's exact origin — no wildcard. Set after the
      # frontend is deployed; see the two-step order in README.md.
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: LOCAL_DATA_DIR
        value: ./local-data
